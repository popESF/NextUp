<style>

.dots{display:flex;justify-content:center;gap:8px;height:14px;margin-bottom:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:var(--card);transition:transform .3s,background .3s}
.dots i.on{background:var(--sun);transform:scale(1.35)}

.mouth{width:26px;height:12px;border:3px solid #1B1033;border-top:0;border-radius:0 0 30px 30px;transition:all .25s}
.m-o .mouth{width:15px;height:15px;border:3px solid #1B1033;border-radius:50%}

.m-dizzy .mouth{width:20px;height:8px;border-radius:50%;border:3px solid #1B1033}

#ball.happy{animation:hop .9s ease-in-out 2}

.bubble:before{content:"";position:absolute;top:-14px;left:calc(50% - 12px);width:20px;height:20px;background:var(--card);border-left:4px solid var(--line);border-top:4px solid var(--line);transform:rotate(45deg)}
.sub{font-size:.95rem;font-weight:400;opacity:.85;display:block}

.opt{font:600 1.05rem "Fredoka",sans-serif;color:var(--ink);background:var(--card);border:4px solid var(--line);border-radius:18px;padding:12px 8px;cursor:pointer;box-shadow:4px 4px 0 var(--line);transition:transform .15s,box-shadow .15s,background .15s}

.opt:hover{transform:translate(-2px,-3px) rotate(-1.5deg);box-shadow:6px 7px 0 var(--line)}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.opt.sel{background:var(--pink);color:#1B1033}
.btn{font:400 1.2rem "Bowlby One",sans-serif;color:#1B1033;background:var(--sun);border:4px solid var(--line);border-radius:999px;padding:14px 30px;cursor:pointer;box-shadow:5px 5px 0 var(--line);margin:22px 6px 0;transition:transform .15s,box-shadow .15s}

.btn:disabled{opacity:.45;cursor:not-allowed}

.sl{background:var(--card);border:4px solid var(--line);border-radius:18px;padding:8px 14px 10px;margin:0 0 10px;text-align:left;box-shadow:4px 4px 0 var(--line)}

input[type=range]{width:100%;accent-color:var(--pink);height:26px}

.a3{animation:zoom .6s cubic-bezier(.3,1.6,.5,1)}.a4{animation:wob .8s ease-out}.a5{animation:slideL .5s cubic-bezier(.3,1.4,.5,1)}

@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{10%{transform:translate(-26px,8px) rotate(-14deg)}25%{transform:translate(28px,-14px) rotate(16deg)}40%{transform:translate(-30px,-6px) rotate(-18deg)}55%{transform:translate(30px,10px) rotate(14deg)}70%{transform:translate(-18px,-12px) rotate(-10deg)}85%{transform:translate(14px,6px) rotate(8deg)}}

.p-splash{animation:drop .8s cubic-bezier(.3,1.5,.5,1) 2.1s backwards}.page-splash .bubble{animation:pop .45s cubic-bezier(.3,1.7,.5,1) 1.7s backwards}

.p-grade,.p-level{animation:flip .65s ease-out}.p-region{animation:zoom .6s cubic-bezier(.3,1.6,.5,1)}.p-shake{animation:slideL .5s cubic-bezier(.3,1.4,.5,1)}

.opt .sub{margin-top:4px;font-weight:400;font-size:.88rem}a.btn{display:inline-block;text-decoration:none;margin-top:18px}

</style>

  if(page==='quiz')return `<div class="grid">${Q[qi][1].map((o,i)=>`<button type="button" class="opt ${ans[qi]===i?'sel':''}" data-v="${i}" style="animation-delay:${i*.05}s"><em>${o[0]}</em>${o[1]}</button>`).join('')}</div><button class="btn alt" id="skip">Skip, I’ll choose myself</button>`;
  if(page==='verdict'){const o=[V.route,...['uni','app','col'].filter(r=>r!==V.route)],P=Object.fromEntries(PATHS.map(p=>[p[0],p]));return `<div class="grid">${o.map((r,i)=>`<button type="button" class="opt" data-v="${r}"><em>${P[r][1]}</em>${P[r][2]}<span class="sub">${i?'Switch to this instead':'Best fit for you'}</span></button>`).join('')}</div>`}
  if(page==='path')return opts(PATHS,v=>S.path===v,3);
  if(page==='subj')return opts(SUBJ,v=>S.subj===v);
  if(page==='grade')return opts(GR,v=>S.grade===v);
  if(page==='region')return opts(REG,v=>S.regs.includes(v));
  if(page==='field')return opts(FIELDS,v=>S.field===v);
  if(page==='level')return opts(LEVELS,v=>S.level===v,3);
  if(page==='vibes')return F.map(f=>`<div class="sl"><div><label for="w_${f[0]}">${f[1]} ${f[2]}</label><output id="o_${f[0]}">${W[f[0]]}</output></div><input type="range" id="w_${f[0]}" min="0" max="5" value="${W[f[0]]}"></div>`).join('');
  if(page==='shake')return `<button class="btn" id="shake">Shake the ball!</button>`;
  if(S.path==='uni')return `${res.pick.map((r,i)=>card(r,i,false)).join('')}${res.rest.length?`<h2 class="more">Also worth a look</h2>${res.rest.map((r,i)=>card(r,i,true)).join('')}`:''}<button class="btn" id="again">Shake again</button><button class="btn alt" id="restart">Start over</button>`;
  const app_=S.path==='app';
  return `${res.map((r,i)=>vcard(r,i)).join('')}<a class="btn alt" target="_blank" rel="noopener" href="${app_?'https://www.findapprenticeship.service.gov.uk/':'https://nationalcareers.service.gov.uk/find-a-course'}">${app_?'Find real apprenticeship vacancies':'Search real courses near you'}</a><br><button class="btn alt" id="switch">${app_?'Compare with college courses':'Compare with apprenticeships'}</button><button class="btn" id="again">Shake again</button><button class="btn alt" id="restart">Start over</button>`;
}
function card(r,i,sm){const w=!r.has?'Check this university offers your subject area.':r.spec?'Specialist course: check its exact entry requirements.':'';return `<div class="card ${sm?'sm':''}" style="animation-delay:${i*.2}s"><h3>${r.u.n}</h3><div class="city">${r.u.city}</div><div class="pct">${Math.round(r.s*100)}%</div><span class="tag ${r.tier}">${r.tier}</span>${r.why.map(x=>`<span class="tag">${x}</span>`).join('')}${w?`<p class="warn">${w}</p>`:''}</div>`}
function vcard(r,i){const p=S.path;return `<div class="card" style="animation-delay:${i*.2}s"><h3>${r.r.name}</h3><div class="city">${QUAL[p][r.lv]}</div><div class="pct">${Math.round(r.s*100)}%</div><span class="tag ${p==='app'?'Reach':'Match'}">${p==='app'?'Apprenticeship':'College course'}</span><span class="tag">${DUR[p][r.lv]}</span>${r.why.map(x=>`<span class="tag">${x}</span>`).join('')}<p class="warn">${r.r.blurb}.${r.off?' Nearest level available.':''}</p></div>`}
const Q=[['Which sounds like your best day at work?',[['🔧','Fixing or building something real',{make:2}],['💻','Solving a puzzle on a screen',{tech:2}],['🤝','Helping someone feel better',{care:2}],['🎨','Making something people notice',{create:1,style:1}]]],
['What are you naturally good at?',[['🗣️','Explaining and persuading',{biz:2}],['🔬','Working out how things work',{sci:1,tech:1}],['💇','Making people look and feel great',{style:2}],['🍳','Looking after people with food and fun',{food:2}]]],
['Where would you like to work?',[['🏢','An office or a lab',{biz:1,sci:1,tech:1}],['🌳','Outdoors with plants or animals',{sci:2}],['🏥','Out and about with people',{care:1,active:1}],['🏗️','On site or in a workshop',{make:2}]]],
['What would be most exciting?',[['🚀','Inventing the next big thing',{tech:1,sci:1}],['🏆','Coaching or keeping people active',{active:2}],['🎬','Making content, shows or games',{create:2}],['🏡','Running my own business one day',{biz:1,style:1,food:1}]]],
['How do you like to learn?',[['📚','Reading, essays and research',{uni:3}],['🧰','On the job while earning a wage',{app:3}],['🧑‍🏫','Practical classes with tutors',{col:3}],['🔀','A bit of everything',{uni:1,app:1,col:1}]]],
['How long before you want to be working?',[['🎓','3 or more years is fine, I want the full degree',{uni:3}],['💷','As soon as possible, I want to earn',{app:3,col:1}],['⏱️','A year or two of study, then work',{col:3,app:1}],['🤷','No idea yet',{}]]]];
const TH={care:['caring work','NU','HC','col'],make:['building and fixing','EN','CO','app'],tech:['tech','CS','DT','uni'],create:['creative work','AR','CM','col'],style:['hair and beauty','AR','HB','col'],biz:['business','BU','BF','uni'],sci:['science and nature','BI','AN','uni'],food:['food and hospitality','BU','HO','app'],active:['sport and fitness','SP','SP','col']};
function verdict(){const sc={};ans.forEach((a,i)=>{const d=Q[i][1][a][2];for(const k in d)sc[k]=(sc[k]||0)+d[k]});
  const th=Object.keys(TH).sort((a,b)=>(sc[b]||0)-(sc[a]||0)),rs={uni:sc.uni||0,app:sc.app||0,col:sc.col||0};rs[TH[th[0]][3]]+=1;
  return{main:th[0],top:th.slice(0,2).filter(k=>sc[k]),route:Object.keys(rs).sort((a,b)=>rs[b]-rs[a])[0]}}
function say(){if(page==='quiz')return `${Q[qi][0]}<span class="sub">Question ${qi+1} of ${Q.length}</span>`;if(page==='verdict')return `You sound into ${V.top.map(k=>TH[k][0]).join(' and ')}. This route looks like your best fit, but you can switch!`;return SAY[page]||''}
function go(p){page=p;render()}
function render(){
  const mid=page!=='splash'&&page!=='result',idx=flow.indexOf(page);
  $('dots').innerHTML=mid&&idx>=0?flow.slice(0,-1).map((_,k)=>`<i class="${k<=idx?'on':''}"></i>`).join(''):'';
  ball.className=page==='splash'?'roll':page==='shake'?'':page==='result'?'sm happy':'sm';
  ball.querySelector('.face').className='face m-'+MOOD[page];
  const nx=page==='region'||page==='vibes'?`<button class="btn" id="next">${page==='vibes'?'Done!':'Next'}</button>`:'';
  const bk=mid?`<button class="btn alt" id="back">Back</button>`:'';
  app.className='page-'+page;app.innerHTML=`<div class="bubble" id="bub">${say()}</div><div class="pg p-${page}" id="pg">${body()}${nx}${mid?'<br>':''}${bk}</div>`;
  const key={path:'path',subj:'subj',grade:'grade',field:'field',level:'level'}[page];
  if(key)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const v=/^\d+$/.test(b.dataset.v)?+b.dataset.v:b.dataset.v;S[key]=v;if(key==='path')flow=FLOWS[v];
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    setTimeout(()=>go(flow[flow.indexOf(page)+1]),380)});
  if(page==='region')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v,i=S.regs.indexOf(v);i<0?S.regs.push(v):S.regs.splice(i,1);b.classList.toggle('sel')});
  if(page==='vibes'){const F=S.path==='uni'?FACT:FACT2,W=S.path==='uni'?S.w:S.w2;F.forEach(f=>$('w_'+f[0]).oninput=e=>{W[f[0]]=+e.target.value;$('o_'+f[0]).textContent=e.target.value})}
  if(page==='quiz')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[qi]=+b.dataset.v;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');setTimeout(()=>{if(qi<Q.length-1){qi++;render()}else{V=verdict();S.subj=TH[V.main][1];S.field=TH[V.main][2];go('verdict')}},380)});
  if(page==='verdict')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.path=b.dataset.v;flow=FLOWS[S.path];document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');setTimeout(()=>go(flow[1]),380)});
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on('start',()=>{qi=0;go('quiz')});on('skip',()=>go('path'));on('next',()=>go(flow[flow.indexOf(page)+1]));on('back',()=>{if(page==='quiz'){if(qi>0){qi--;render()}else go('splash')}else if(page==='verdict'){qi=Q.length-1;go('quiz')}else if(page==='path')go('quiz');else go(flow[flow.indexOf(page)-1])});
  on('shake',shake);on('again',()=>go('shake'));on('switch',()=>{S.path=S.path==='app'?'col':'app';res=computeV();render();window.scrollTo({top:0,behavior:'smooth'})});
  on('restart',()=>{Object.assign(S,{path:null,subj:null,grade:null,regs:[],field:null,level:null});flow=FLOWS.uni;ans=[];qi=0;go('splash')});
}
function shake(){
  ball.className='shaking';ball.querySelector('.face').className='face m-dizzy';$('bub').textContent='Whoaaa… the answer is swirling…';
  setTimeout(()=>{res=S.path==='uni'?compute():computeV();go('result');window.scrollTo({top:0,behavior:'smooth'})},1200);
}
ball.onclick=()=>{if(page==='shake')shake()};
function compute(){
  const t=S.grade,sj=SUBJ.find(x=>x[0]===S.subj),list=[];let tot=0;FACT.forEach(f=>tot+=S.w[f[0]]);
  const w=tot?S.w:Object.fromEntries(FACT.map(f=>[f[0],1])),tw=tot||FACT.length;
  U.forEach(u=>{const d=u.g-t;if(d<=-2)return;let b=0;FACT.forEach(f=>b+=w[f[0]]*u.v[f[0]]/5);b/=tw;
    let s=.4+.6*b;const has=u.sub.includes(sj[3]);if(!has)s*=.55;if(S.regs.length&&!S.regs.includes(u.reg))s*=.8;
    const why=FACT.filter(f=>w[f[0]]>=3&&u.v[f[0]]>=4).sort((a,c)=>w[c[0]]*u.v[c[0]]-w[a[0]]*u.v[a[0]]).slice(0,3).map(f=>f[3]);
    list.push({u,s,why,has,spec:sj[4],tier:d<0?'Reach':d===0?'Match':'Safe'})});
  list.sort((a,b)=>b.s-a.s);
  const pick=[],q={Reach:1,Match:2,Safe:2};
  ['Reach','Match','Safe'].forEach(k=>list.filter(r=>r.tier===k&&r.has).slice(0,q[k]).forEach(r=>pick.push(r)));
  list.filter(r=>!pick.includes(r)&&r.has).forEach(r=>{if(pick.length<5)pick.push(r)});
  const o={Reach:0,Match:1,Safe:2};pick.sort((a,b)=>o[a.tier]-o[b.tier]||b.s-a.s);
  return{pick,rest:list.filter(r=>!pick.includes(r)).slice(0,5)};
}
function computeV(){
  const L=S.level,wt=S.w2,app_=S.path==='app';let tot=0;FACT2.forEach(x=>tot+=wt[x[0]]);
  const w=tot?wt:Object.fromEntries(FACT2.map(x=>[x[0],1])),tw=tot||FACT2.length;
  return ROLES.filter(r=>r.f===S.field).map(r=>{
    const lv=r.l.includes(L)?L:r.l.reduce((a,b)=>Math.abs(b-L)<Math.abs(a-L)?b:a),hi=lv>=4;
    const v={hands:app_?5:3,earn:app_?5:1,speed:Math.max(1,(app_?3:4)-(hi?1:0)),prog:Math.min(5,(app_?3:4)+(hi?1:0)),secure:app_?4:3};
    let b=0;FACT2.forEach(x=>b+=w[x[0]]*v[x[0]]/5);b/=tw;
    return{r,lv,off:lv!==L,s:.4+.6*b,why:FACT2.filter(x=>w[x[0]]>=3&&v[x[0]]>=4).slice(0,3).map(x=>x[3])};
  }).sort((a,b)=>a.off-b.off||b.s-a.s).slice(0,5);
}
render();
</script>
